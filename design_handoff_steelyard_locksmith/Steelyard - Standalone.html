<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Apex Locksmith — Steelyard</title>
<meta name="viewport" content="width=1280"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin:0; padding:0; background:#18181a; }
  * { box-sizing: border-box; }
  body { min-width: 1280px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="brand.js"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="steel-atoms.jsx"></script>
<script type="text/babel" src="steelyard.jsx"></script>

<script type="text/babel">
  // Default to Steelyard's intended dark theme; all home sections on.
  const sections = { trust:true, finder:true, services:true, process:true, reviews:true, about:true };
  ReactDOM.createRoot(document.getElementById('root')).render(
    <window.SteelyardSite dark={true} sections={sections}/>
  );
</script>
</body>
</html>
