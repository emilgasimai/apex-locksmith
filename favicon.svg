<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Aston Locksmith">
  <!-- Unlocked padlock brand mark: cyan keyhole body with the shackle drawn
       OPEN (right leg lifted clear of the body) on the portal-dark square. -->
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20242a"/>
      <stop offset="1" stop-color="#0d0d0e"/>
    </linearGradient>
    <mask id="favKeyhole">
      <rect x="11" y="18" width="18" height="15" rx="4" fill="#fff"/>
      <circle cx="20" cy="24.4" r="2.4" fill="#000"/>
      <rect x="18.75" y="24.4" width="2.5" height="4.9" rx="1.25" fill="#000"/>
    </mask>
  </defs>
  <rect width="40" height="40" rx="9" fill="url(#favBg)"/>
  <path d="M14 22 V13 a6.5 6.5 0 0 1 12 -1.5" stroke="#27E0F5" stroke-width="3.6" stroke-linecap="round" fill="none"/>
  <rect x="11" y="18" width="18" height="15" rx="4" fill="#27E0F5" mask="url(#favKeyhole)"/>
</svg>
